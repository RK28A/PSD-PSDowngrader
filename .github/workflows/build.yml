name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['src/**', 'build.sh', '.github/workflows/build.yml']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64
      - name: Build PSD.exe
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PSD
          path: build/PSD.exe
          retention-days: 30
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/PSD.exe
