name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['src/**', 'build.sh']
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag de release à publier (ex. v2.1), vide = build seul'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64
      - name: Build PSD.exe
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PSD
          path: build/PSD.exe
          retention-days: 30
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: PSD ${{ inputs.release || github.ref_name }}
          body_path: .github/release-notes.md
          files: build/PSD.exe
